<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Voluntario - Unión de Ornitólogos de Chile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Registro de Voluntario(a)</h1>
    <p>Publicado por la <strong>Unión de Ornitólogos de Chile</strong></p>

    <p><a href="{{ url_for('index') }}">← Volver al Menú Principal</a></p>

    <!-- Bloque de Errores de Validación enviados por el Backend -->
    {% if errores %}
        <div style="background-color: #f8d7da; color: #721c24; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #f5c6cb;">
            <p style="margin-top: 0; font-weight: bold;">Por favor corrija los siguientes errores:</p>
            <ul style="margin-bottom: 0;">
                {% for err in errores %}
                    <li>{{ err }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form id="form-voluntario" action="{{ url_for('registro_voluntario') }}" method="post" novalidate>
        
        <!-- Nombre Completo -->
        <p>
            <label for="nombre">Nombre Completo *</label><br>
            <input type="text" id="nombre" name="nombre" value="{{ datos_previos.get('nombre', '') if datos_previos else '' }}" required>
            <span id="error-nombres" class="mensaje-error"></span>
        </p>

        <!-- Correo Electrónico -->
        <p>
            <label for="email">Correo Electrónico *</label><br>
            <input type="email" id="email" name="email" value="{{ datos_previos.get('email', '') if datos_previos else '' }}" placeholder="ejemplo@correo.cl" required>
            <span id="error-email" class="mensaje-error"></span>
        </p>

        <!-- Teléfono -->
        <p>
            <label for="telefono">Número de Teléfono</label><br>
            <input type="tel" id="telefono" name="telefono" value="{{ datos_previos.get('telefono', '') if datos_previos else '' }}" placeholder="+56912345678">
            <span id="error-telefono" class="mensaje-error"></span>
        </p>

        <!-- Región de residencia en Chile -->
        <p>
            <label for="region">Región de residencia en Chile *</label><br>
            <select id="region" name="region_id">
                <option value="">Seleccione una región</option>
                {% for region in regiones %}
                    <option value="{{ region.id }}" {% if datos_previos and datos_previos.get('region_id') == region.id|string %}selected{% endif %}>
                        {{ region.nombre }}
                    </option>
                {% endfor %}
            </select>
            <span id="error-region" class="mensaje-error"></span>
        </p>

        <!-- Comuna -->
        <p>
            <label for="comuna">Comuna de residencia en Chile *</label><br>
            <select id="comuna" name="comuna_id" required>
                <option value="">Seleccione primero una región</option>
            </select>
            <span id="error-comuna" class="mensaje-error"></span>
        </p>

        <!-- Botones -->
        <p>
            <input type="submit" value="Completar Registro">
            <input type="reset" value="Limpiar">
        </p>

    </form>

    <p><small>&copy; 2026 Unión de Ornitólogos de Chile.</small></p>

    <script src="{{ url_for('static', filename='js/voluntario.js') }}"></script>
</body>
</html>
